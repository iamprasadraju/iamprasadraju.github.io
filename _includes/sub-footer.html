<div class="sub-footer">
  <div class="sf-toggle" onclick="toggleSubFooter()">
    <span class="sf-toggle-icon"></span>
  </div>
  <div class="sf-body">
    <span>Theme:</span>
    <select id="skin-switch" aria-label="Theme Selector" onchange="changeSkin()">
      <option value="classic">classic</option>
      <option value="dark">dark</option>
      <option value="auto">auto</option>
      <option value="solarized-light">solarized light</option>
      <option value="solarized-dark">solarized dark</option>
    </select>
  </div>
</div>

<script>
  (function() {
    var select = document.getElementById("skin-switch");
    var current = localStorage.getItem("portfolio-skin") || "classic";
    select.value = current;

    window.changeSkin = function() {
      var skin = select.value;
      document.documentElement.setAttribute("data-theme", skin);
      localStorage.setItem("portfolio-skin", skin);
    };
  })();

  (function() {
    var subFooter = document.querySelector(".sub-footer");
    if (localStorage.getItem("portfolio-sf-hidden") === "true") {
      subFooter.classList.add("sub-footer-hidden");
    }
    window.toggleSubFooter = function() {
      subFooter.classList.toggle("sub-footer-hidden");
      localStorage.setItem("portfolio-sf-hidden", subFooter.classList.contains("sub-footer-hidden"));
    };
  })();
</script>
