<div class="sub-footer">
  <span id="sf-toggle" onclick="toggleSubFooter()">
    <span class="sf-toggle-icon"></span>
  </span>
  <div id="skin-switch-container">
    Page rendered with the <select id="skin-switch" aria-label="Theme Selector" onchange="changeSkin()">
      {%- for skin in page.available_skins %}
      {%- if skin == 'solarized' %}{% continue %}{% endif -%}
      {% if skin == 'classic' -%}
      <option value="classic.css">classic</option>
      {%- else -%}
      <option value="{{ skin }}.css">{{ skin }}</option>
      {%- endif %}
      {%- endfor %}
    </select> skin of Minima theme.
    <div><small>Theme-switcher is not a part of Minima</small></div>
  </div>
</div>

<script>
  document.getElementById("skin-switch-container").style.display = "block";
  var metaTag = document.getElementById("main-stylesheet");
  var skinSwitcher = document.getElementById("skin-switch");
  var SSHref = metaTag.href;
  var SSName = SSHref.substring(SSHref.lastIndexOf('/') + 1);
  var prevSkin = localStorage.getItem("minima-ss");

  function themeName(skin) {
    var name = skin.replace(".css", "");
    if (name === "style") return "classic";
    if (name === "solarized") {
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "solarized-dark" : "solarized-light";
    }
    return name;
  }

  if (prevSkin) {
    skinSwitcher.value = prevSkin;
    document.documentElement.setAttribute('data-theme', themeName(prevSkin));
  } else {
    skinSwitcher.value = SSName;
    document.documentElement.setAttribute('data-theme', themeName(SSName));
  }

  function changeSkin() {
    var _ssName = skinSwitcher.value;
    metaTag.href = SSHref.replace(SSName, _ssName);
    localStorage.setItem("minima-ss", _ssName);
    document.documentElement.setAttribute('data-theme', themeName(_ssName));
  }

  var siteFooter = document.querySelector(".site-footer");
  if (localStorage.getItem("sf-hidden") === "true") {
    siteFooter.classList.add("sub-footer-hidden");
  }

  function toggleSubFooter() {
    siteFooter.classList.toggle("sub-footer-hidden");
    localStorage.setItem("sf-hidden", siteFooter.classList.contains("sub-footer-hidden"));
  }
</script>
