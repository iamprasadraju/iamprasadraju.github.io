<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"></noscript>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      mermaid.initialize({ startOnLoad: false, theme: "neutral" });
      
      var mermaidBlocks = document.querySelectorAll(
        "pre code.language-mermaid, div.highlight-mermaid pre code, div.language-mermaid pre"
      );
      
      mermaidBlocks.forEach(function(block) {
        var pre = block.closest("pre");
        if (!pre) return;
        
        var text = block.textContent || pre.textContent;
        var graphDiv = document.createElement("div");
        graphDiv.className = "mermaid";
        graphDiv.textContent = text.trim();
        pre.parentNode.replaceChild(graphDiv, pre);
      });
      mermaid.run();
    });
  </script>

  <link id="main-stylesheet" rel="stylesheet" href="{{ '/assets/css/dark.css' | relative_url }}">
  <script>
    var prevSkin = localStorage.getItem("minima-ss");
    if (prevSkin && prevSkin !== "dark.css") {
      document.getElementById("main-stylesheet").href = "{{ '/assets/css/' | relative_url }}" + prevSkin;
    }
  </script>

  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var links = document.querySelectorAll("a[href]");
      links.forEach(function (link) {
        var href = link.getAttribute("href");
        if (
          href &&
          /^https?:\/\//i.test(href) &&
          !href.startsWith(window.location.origin)
        ) {
          link.setAttribute("target", "_blank");
          link.setAttribute("rel", "noopener noreferrer");
        }
      });
    });
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      renderMathInElement(document.body, {
        delimiters: [
          {left: "$$", right: "$$", display: true},
          {left: "$", right: "$", display: false}
        ],
        throwOnError: false
      });
    });
  </script>
  {%- include custom-head.html -%}
</head>
