<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="{{ site.description }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <link href="/feed.xml" type="application/atom+xml" rel="alternate" title="{{ site.title }} posts" />

    <!-- Theme: FOUC-blocking + load correct skin -->
    <script>
      (function() {
        var skin = localStorage.getItem("portfolio-skin") || "classic";
        document.documentElement.setAttribute("data-theme", skin);

        var bgColor = "#fdfdfd";
        if (skin === "dark") bgColor = "#181818";
        else if (skin.indexOf("solarized-dark") > -1) bgColor = "#002b36";
        else if (skin.indexOf("solarized-light") > -1) bgColor = "#fdf6e3";

        var blocker = document.createElement("style");
        blocker.id = "fouc-blocker";
        blocker.innerHTML = "html { background-color: " + bgColor + " !important; } body { opacity: 0; transition: opacity 0.2s ease; }";
        document.head.appendChild(blocker);
      })();
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">

    <!-- Unfade after CSS loads -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        var blocker = document.getElementById("fouc-blocker");
        if (blocker) {
          blocker.innerHTML = "body { opacity: 1; transition: opacity 0.2s ease; }";
          setTimeout(function() { blocker.remove(); }, 300);
        }
      });
    </script>

    <!-- Google Analytics -->
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
      ga('create', 'UA-3698471-23', 'auto');
      ga('send', 'pageview');
    </script>

</head>
