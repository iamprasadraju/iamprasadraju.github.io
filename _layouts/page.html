---
layout: base
---
<article class="post{% if page.layout_class %} {{ page.layout_class }}{% endif %}">

  {% if page.title %}
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

</article>
